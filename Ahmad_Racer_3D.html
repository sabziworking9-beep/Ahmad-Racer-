<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ahmad Racer 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Arial,sans-serif;color:#fff}
#game{position:fixed;inset:0}.ui{position:fixed;inset:0;pointer-events:none}
.panel{pointer-events:auto;background:rgba(8,14,22,.88);border:1px solid rgba(255,255,255,.16);border-radius:18px;box-shadow:0 12px 40px #0008;backdrop-filter:blur(8px)}
#lobby{z-index:20;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(#06111ccc,#06111c55),radial-gradient(circle at 50% 30%,#284d6b,#071018 70%)}
.lobbyBox{width:min(92vw,520px);padding:28px;text-align:center}.logo{font-size:46px;font-weight:900;letter-spacing:2px;text-shadow:0 5px 0 #0008;margin:5px}.sub{color:#b9d2e8;margin:5px 0 22px}
button{border:0;border-radius:12px;padding:14px 22px;font-size:18px;font-weight:800;cursor:pointer;color:#fff;background:#e44b36;box-shadow:0 5px 0 #9f2c20;margin:7px}
button:active{transform:translateY(2px);box-shadow:0 3px 0 #9f2c20}.secondary{background:#2477b9;box-shadow:0 5px 0 #15527f}
#hud{z-index:10;display:none;position:absolute;inset:0}.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.badge{background:#08121dcc;padding:10px 14px;border-radius:12px;border:1px solid #ffffff22;font-weight:800}
#speed{position:absolute;right:18px;bottom:22px;width:120px;height:120px;border-radius:50%;border:8px solid #ffffff55;background:#09131ddd;display:flex;flex-direction:column;align-items:center;justify-content:center}
#speed b{font-size:32px}.small{font-size:12px;color:#a9bac8}
#controls{position:absolute;left:15px;right:15px;bottom:18px;display:flex;justify-content:space-between;align-items:end}
.ctrlGroup{display:flex;gap:10px}.ctrl{width:64px;height:58px;padding:0;border-radius:15px;background:#101b27dd;border:1px solid #ffffff30;box-shadow:0 4px 0 #0007;font-size:24px}
#garage{display:none;z-index:20;pointer-events:auto;position:absolute;inset:0;overflow:auto;padding:20px;background:linear-gradient(#07111bee,#07111bf0)}
.gHead{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:auto;gap:10px}.cars{max-width:1000px;margin:20px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.car{padding:14px}.car.selected{outline:3px solid #ffcc45}.car h3{margin:6px 0}.car p{margin:5px 0;color:#b9c8d5}.carVisual{height:90px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.carBody{width:125px;height:35px;border-radius:14px 25px 9px 9px;background:var(--c);position:relative;box-shadow:inset 0 -8px 0 #0003}
.carBody:before{content:"";position:absolute;width:55px;height:22px;left:38px;top:-14px;background:var(--c);border-radius:20px 20px 3px 3px}
.carBody:after{content:"";position:absolute;width:42px;height:12px;left:45px;top:-10px;background:#bfe8ff99;border-radius:9px}
.wheel{position:absolute;width:25px;height:25px;border-radius:50%;background:#111;border:5px solid #444;bottom:-12px}.w1{left:17px}.w2{right:17px}
#message{display:none;position:absolute;inset:0;align-items:center;justify-content:center;background:#0008}.msg{padding:30px;text-align:center}.msg h1{font-size:48px;margin:0 0 12px}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:105px;background:#07111dcc;padding:8px 13px;border-radius:10px;color:#d9e7f2;font-size:13px}
@media(max-width:600px){.logo{font-size:38px}.lobbyBox{padding:20px}.top{font-size:13px}.ctrl{width:58px;height:54px}#hint{bottom:95px}.cars{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="game"></div>
<div class="ui">
<section id="lobby">
 <div class="panel lobbyBox">
  <div class="logo">🏁 AHMAD RACER</div>
  <div id="loadStatus" class="small">Loading 3D engine...</div>
  <button id="start">START RACE</button>
  <button id="openGarage" class="secondary">GARAGE</button>
 </div>
</section>

<section id="garage">
 <div class="gHead"><h1>🚘 Garage</h1><div><b id="garageCoins">0</b> 🪙</div></div>
 <div id="cars" class="cars"></div>
 <div style="text-align:center"><button id="closeGarage" class="secondary">BACK TO LOBBY</button></div>
</section>

<section id="hud">
 <div class="top">
  <div class="badge">Stage <span id="stage">1</span>/20</div>
  <div class="badge">🪙 <span id="coins">0</span></div>
  <div class="badge">🚦 <span id="light">GREEN</span></div>
 </div>
 <div id="hint">Avoid traffic • Stop on RED • Collect coins</div>
 <div id="speed"><b id="speedVal">0</b><span class="small">KM/H</span></div>
 <div id="controls">
  <div class="ctrlGroup"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div>
  <div class="ctrlGroup"><button class="ctrl" data-key="brake">🛑</button><button class="ctrl" data-key="gas">▲</button></div>
 </div>
</section>

<section id="message"><div class="panel msg"><h1 id="msgTitle">YOU LOSE</h1><p id="msgText"></p><button id="retry">RETRY</button><button id="menu" class="secondary">LOBBY</button></div></section>
</div>

<script type="module">
const loadStatus=document.getElementById("loadStatus");
window.addEventListener("error",e=>{
  if(loadStatus){loadStatus.textContent="Game error: "+(e.message||"Unknown error");loadStatus.style.color="#ff8b7d";}
});
window.addEventListener("unhandledrejection",e=>{
  if(loadStatus){loadStatus.textContent="Game loading error. Please reopen the file.";loadStatus.style.color="#ff8b7d";}
});
let THREE;
try{
  THREE=await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js");
}catch(e){
  if(loadStatus){
    loadStatus.textContent="3D engine could not load. Make sure you are connected to the internet.";
    loadStatus.style.color="#ff8b7d";
  }
  throw e;
}

const root=document.getElementById("game");
const lobby=document.getElementById("lobby"),garage=document.getElementById("garage"),hud=document.getElementById("hud"),message=document.getElementById("message");
const stageEl=document.getElementById("stage"),coinsEl=document.getElementById("coins"),speedEl=document.getElementById("speedVal"),lightEl=document.getElementById("light");
const carDefs=[
 {name:"Starter",price:0,max:50,c:"#e44b36"},
 {name:"Falcon",price:100,max:65,c:"#2f83c7"},
 {name:"Thunder",price:250,max:80,c:"#e5a82d"},
 {name:"Shadow",price:450,max:95,c:"#5d6470"},
 {name:"Viper",price:700,max:110,c:"#3ea85b"},
 {name:"Raptor",price:1000,max:125,c:"#b34eaa"},
 {name:"Apex",price:1400,max:140,c:"#d7d9df"},
 {name:"Rocket",price:1900,max:155,c:"#f06c27"}
];
let owned=[true,false,false,false,false,false,false,false],selected=0,totalCoins=0,stage=1,playing=false,gameOver=false;
const keys={left:false,right:false,gas:false,brake:false};
let scene,camera,renderer,player,traffic=[],coinObjs=[],roadMarks=[],signal=null,worldZ=0,last=0,speed=0,light="GREEN",lightTimer=0,stageDistance=0,trafficSpawn=0,coinSpawn=0;

// Simple built-in game audio (no extra audio files needed)
let audioCtx=null, masterGain=null, engineOsc=null, engineGain=null, engineFilter=null, audioStarted=false;
function initAudio(){
 try{
  if(audioCtx){if(audioCtx.state==='suspended')audioCtx.resume();return}
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  masterGain=audioCtx.createGain(); masterGain.gain.value=.32; masterGain.connect(audioCtx.destination);
  engineOsc=audioCtx.createOscillator(); engineOsc.type='sawtooth';
  engineFilter=audioCtx.createBiquadFilter(); engineFilter.type='lowpass'; engineFilter.frequency.value=900;
  engineGain=audioCtx.createGain(); engineGain.gain.value=0;
  engineOsc.connect(engineFilter); engineFilter.connect(engineGain); engineGain.connect(masterGain); engineOsc.start();
  audioStarted=true;
 }catch(e){audioStarted=false;}
}
function tone(freq,duration,type='sine',volume=.12,slide=0){
 if(!audioStarted||!audioCtx)return;
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);
 if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,freq+slide),audioCtx.currentTime+duration);
 g.gain.setValueAtTime(.0001,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(volume,audioCtx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+duration);
 o.connect(g);g.connect(masterGain);o.start();o.stop(audioCtx.currentTime+duration+.02);
}
function coinSound(){tone(880,.09,'square',.09,220);setTimeout(()=>tone(1320,.12,'square',.08),55)}
function brakeSound(){tone(120,.16,'sawtooth',.07,-35)}
function crashSound(){tone(95,.5,'sawtooth',.22,-55);setTimeout(()=>tone(55,.35,'square',.14,-25),80)}
function winSound(){tone(523,.15,'sine',.12);setTimeout(()=>tone(659,.15,'sine',.12),130);setTimeout(()=>tone(784,.28,'sine',.14),260)}
function startSound(){tone(330,.12,'square',.08);setTimeout(()=>tone(494,.2,'square',.08),100)}
function updateEngineSound(){
 if(!audioStarted||!engineOsc)return;
 const now=audioCtx.currentTime;
 const moving=Math.min(1,speed/90);
 const targetFreq=65+speed*3.2+(keys.gas?22:0);
 engineOsc.frequency.setTargetAtTime(targetFreq,now,.04);
 engineFilter.frequency.setTargetAtTime(500+speed*14,now,.08);
 engineGain.gain.setTargetAtTime(playing ? (.018+.075*moving+(keys.gas?.018:0)) : 0,now,.08);
}

function init3D(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x87bde5);
 scene.fog=new THREE.Fog(0x87bde5,70,230);
 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
 camera.position.set(0,5.5,10);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true;
 root.appendChild(renderer.domElement);
 const hemi=new THREE.HemisphereLight(0xddeeff,0x5f7d3d,1.7);scene.add(hemi);
 const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(30,60,20);sun.castShadow=true;scene.add(sun);
 makeWorld(); makePlayer();
 addEventListener("resize",resize);
 renderer.setAnimationLoop(loop);
}
function box(w,h,d,c,x,y,z,round=false){const g=new THREE.BoxGeometry(w,h,d);const m=new THREE.MeshStandardMaterial({color:c,roughness:.72,metalness:.08});const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function makeWorld(){
 const grass=box(160,.2,600,0x4e8d43,0,-.15,-220);grass.receiveShadow=true;
 const road=box(15,.15,600,0x343a40,0,0,-220);road.receiveShadow=true;
 for(let z=5;z>-590;z-=8){roadMarks.push(box(.22,.04,3,0xe8e1b7,0,.1,z))}
 for(let x of [-8.5,8.5]) box(.35,.25,600,0xc9c9c9,x,.1,-220);
 // trees and clouds
 for(let z=0;z>-560;z-=28){
  for(let side of [-1,1]){
   const x=side*(15+Math.random()*20); box(1.2,4,1.2,0x6d4728,x,2,z);
   const crown=new THREE.Mesh(new THREE.SphereGeometry(3,12,8),new THREE.MeshStandardMaterial({color:0x2e7337}));crown.position.set(x,5,z);crown.castShadow=true;scene.add(crown);
  }
 }
 for(let i=0;i<9;i++){
  const c=new THREE.Group();
  for(let j=0;j<4;j++){const s=new THREE.Mesh(new THREE.SphereGeometry(2.5+Math.random()*1.4,12,8),new THREE.MeshStandardMaterial({color:0xffffff,roughness:1}));s.position.set(j*3,Math.random()*1.2,0);c.add(s)}
  c.position.set(-55+Math.random()*110,28+Math.random()*10,-30-i*55);scene.add(c);
 }
 // distant planes
 for(let i=0;i<3;i++){const p=new THREE.Group();p.add(box(.3,.15,6,0xf2f2f2,0,0,0));p.add(box(3,.08,.7,0xf2f2f2,0,0,0));p.position.set(-35+i*34,25+i*5,-70-i*100);p.rotation.y=.7;scene.add(p)}
}
function carMesh(def){
 const g=new THREE.Group(), mat=new THREE.MeshStandardMaterial({color:def.c,metalness:.2,roughness:.35});
 const body=new THREE.Mesh(new THREE.BoxGeometry(2.25,.58,4.1),mat);body.position.y=.7;body.castShadow=true;g.add(body);
 const hood=new THREE.Mesh(new THREE.BoxGeometry(2.0,.28,1.3),mat);hood.position.set(0,1.02,-1.35);g.add(hood);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.55,.65,1.7),new THREE.MeshStandardMaterial({color:0x172534,metalness:.1,roughness:.2}));cabin.position.set(0,1.18,.25);cabin.castShadow=true;g.add(cabin);
 for(const x of [-1.02,1.02])for(const z of [-1.35,1.35]){const w=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.28,20),new THREE.MeshStandardMaterial({color:0x111111,roughness:.9}));w.rotation.z=Math.PI/2;w.position.set(x,.43,z);w.castShadow=true;g.add(w)}
 return g;
}
function makePlayer(){player=carMesh(carDefs[selected]);player.position.set(0,0,5);scene.add(player)}
function clearDynamic(){for(const o of [...traffic,...coinObjs])scene.remove(o);traffic=[];coinObjs=[]}
function resetWorld(){clearDynamic();stageDistance=0;trafficSpawn=0;coinSpawn=0;lightTimer=0;light="GREEN";lightEl.textContent=light;speed=0;worldZ=0}
function startGame(){initAudio();startSound();lobby.style.display="none";garage.style.display="none";message.style.display="none";hud.style.display="block";playing=true;gameOver=false;stage=1;stageEl.textContent=stage;resetWorld();player.position.x=0;player.position.z=5;player.rotation.y=0;updatePlayerCar()}
function updatePlayerCar(){scene.remove(player);player=carMesh(carDefs[selected]);player.position.set(0,0,5);scene.add(player)}
function endGame(title,text){playing=false;gameOver=true;updateEngineSound();if(title==="YOU WIN!")winSound();else crashSound();document.getElementById("msgTitle").textContent=title;document.getElementById("msgText").textContent=text;message.style.display="flex"}
function spawnTraffic(){const lanes=[-4.5,0,4.5];const x=lanes[Math.floor(Math.random()*lanes.length)];const def=carDefs[1+Math.floor(Math.random()*Math.min(7,stage/3+2))];const c=carMesh(def);c.scale.setScalar(.9);c.position.set(x,0,-65-Math.random()*25);c.userData.v=8+Math.random()*12;scene.add(c);traffic.push(c)}
function spawnCoin(){const lanes=[-4.5,0,4.5];const c=new THREE.Mesh(new THREE.TorusGeometry(.65,.18,10,24),new THREE.MeshStandardMaterial({color:0xffd23f,metalness:.7,roughness:.25}));c.rotation.x=Math.PI/2;c.position.set(lanes[Math.floor(Math.random()*3)],1,-100-Math.random()*80);c.userData.spin=2;scene.add(c);coinObjs.push(c)}
function trafficSignal(){
 if(!signal){
  signal=new THREE.Group();
  const poleGeo=new THREE.BoxGeometry(.25,6,.25);
  const pole=new THREE.Mesh(poleGeo,new THREE.MeshStandardMaterial({color:0x222222}));
  pole.position.set(8.2,3,-55); signal.add(pole);
  const head=new THREE.Mesh(new THREE.BoxGeometry(.95,2.7,.65),new THREE.MeshStandardMaterial({color:0x111111}));
  head.position.set(8.2,5.0,-55); signal.add(head);
  for(let i=0;i<3;i++){
    const s=new THREE.Mesh(new THREE.SphereGeometry(.31,16,10),new THREE.MeshStandardMaterial({color:i===0?0xff2222:0x333333,emissive:i===0?0x880000:0}));
    s.position.set(8.2,5.75-i*.75,-55); signal.add(s);
  }
  scene.add(signal);
}
}
function setSignal(){lightTimer+=.016;if(lightTimer>=10){light=light==="GREEN"?"RED":"GREEN";lightTimer=0;lightEl.textContent=light}if(signal){const ms=signal.children;for(let i=0;i<3;i++){const active=(light==="RED"&&i===0)||(light==="GREEN"&&i===2);const lamp=ms[i+3];if(lamp){lamp.material.color.set(active?(i===0?0xff2222:0x22dd66):0x333333);lamp.material.emissive.set(active?(i===0?0x880000:0x008833):0)}}}}
function update(dt){
 const def=carDefs[selected], max=def.max;
 if(keys.gas) speed+=38*dt; else speed-=13*dt;
 if(keys.brake){speed-=65*dt;if(speed>3&&Math.random()<dt*5)brakeSound();}
 speed=Math.max(0,Math.min(max,speed));
 const steer=(keys.left?-1:0)+(keys.right?1:0);
 player.position.x+=steer*(5.5+speed*.025)*dt;player.position.x=Math.max(-6.2,Math.min(6.2,player.position.x));
 player.rotation.z=-steer*.05;
 stageDistance+=speed*dt*.035;
 worldZ+=speed*dt*.55;
 for(const m of roadMarks){m.position.z+=speed*dt*.55;if(m.position.z>20)m.position.z-=600;}
 trafficSpawn-=dt;coinSpawn-=dt;
 const trafficRate=stage<10?Math.max(.8,2.4-stage*.12):Math.max(.45,1.5-(stage-10)*.07);
 if(trafficSpawn<=0){spawnTraffic();trafficSpawn=trafficRate}
 if(coinSpawn<=0){spawnCoin();coinSpawn=.7+Math.random()*1.1}
 for(const t of traffic){t.position.z+= (speed-t.userData.v)*dt*.32;if(t.position.z>28)t.position.z=-90-Math.random()*35}
 for(const c of coinObjs){c.position.z+=speed*dt*.55;c.rotation.z+=dt*3}
 traffic=traffic.filter(t=>{if(t.position.z>25){scene.remove(t);return false}return true});
 coinObjs=coinObjs.filter(c=>{if(c.position.z>18){scene.remove(c);return false}return true});
 for(const t of traffic){if(Math.abs(t.position.x-player.position.x)<2.0&&Math.abs(t.position.z-player.position.z)<3.2){endGame("YOU LOSE","You crashed into traffic.");return}}
 for(const c of coinObjs){if(Math.abs(c.position.x-player.position.x)<1.8&&Math.abs(c.position.z-player.position.z)<2.4){totalCoins++;coinsEl.textContent=totalCoins;coinSound();scene.remove(c);coinObjs.splice(coinObjs.indexOf(c),1);break}}
 // red-light checkpoint near z -55
 if(light==="RED"&&player.position.z<-48&&player.position.z>-62&&speed>4){endGame("YOU LOSE","Red light! Brake before crossing the signal.");return}
 if(stageDistance>=30){stage++;stageDistance=0;if(stage>20){endGame("YOU WIN!","All 20 stages completed!");return}stageEl.textContent=stage;totalCoins+=25;coinsEl.textContent=totalCoins}
 setSignal();
 camera.position.x+=(player.position.x*.35-camera.position.x)*dt*4;camera.lookAt(player.position.x,1,-10);
 speedEl.textContent=Math.round(speed);
 updateEngineSound();
}
function loop(t){const dt=Math.min(.035,(t-last)/1000||.016);last=t;if(playing)update(dt);renderer.render(scene,camera)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function renderGarage(){
 document.getElementById("garageCoins").textContent=totalCoins;
 const el=document.getElementById("cars");el.innerHTML="";
 carDefs.forEach((d,i)=>{const card=document.createElement("div");card.className="panel car"+(i===selected?" selected":"");card.innerHTML='<div class="carVisual"><div class="carBody" style="--c:'+d.c+'"><i class="wheel w1"></i><i class="wheel w2"></i></div></div><h3>'+d.name+'</h3><p>Top speed: '+d.max+' km/h</p><p>'+(owned[i]?"Owned":"Price: "+d.price+" 🪙")+'</p>';
 const b=document.createElement("button");b.textContent=owned[i]?(i===selected?"SELECTED":"SELECT"):"BUY";b.className=i===selected?"secondary":"";
 b.addEventListener("click",()=>{if(owned[i]){selected=i;updatePlayerCar();renderGarage()}else if(totalCoins>=d.price){totalCoins-=d.price;owned[i]=true;selected=i;updatePlayerCar();renderGarage()}else alert("Not enough coins yet.");});
 card.appendChild(b);el.appendChild(card)})
}
document.getElementById("start").addEventListener("click",(e)=>{e.preventDefault();startGame();});
document.getElementById("openGarage").onclick=()=>{lobby.style.display="none";garage.style.display="block";renderGarage()};
let lobbyTransitionLock=false;
function backToLobby(){
  if(lobbyTransitionLock)return;
  lobbyTransitionLock=true;
  setTimeout(()=>lobbyTransitionLock=false,120);
  garage.style.display="none";
  message.style.display="none";
  hud.style.display="none";
  lobby.style.display="flex";
  playing=false;
  gameOver=false;
}
document.getElementById("closeGarage").addEventListener("click",backToLobby);
document.getElementById("closeGarage").addEventListener("pointerup",backToLobby);
document.getElementById("retry").onclick=startGame;
document.getElementById("menu").onclick=()=>{message.style.display="none";hud.style.display="none";lobby.style.display="flex"};
document.addEventListener("pointerdown",()=>initAudio(),{once:false});
document.querySelectorAll(".ctrl").forEach(b=>{const k=b.dataset.key;b.addEventListener("pointerdown",e=>{e.preventDefault();keys[k]=true});["pointerup","pointercancel","pointerleave"].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=true;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=true;if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")keys.gas=true;if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")keys.brake=true});
addEventListener("keyup",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")keys.left=false;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")keys.right=false;if(e.key==="ArrowUp"||e.key.toLowerCase()==="w")keys.gas=false;if(e.key==="ArrowDown"||e.key.toLowerCase()==="s")keys.brake=false});
init3D();trafficSignal();
if(loadStatus)loadStatus.style.display="none";
</script>
</body>
</html>
